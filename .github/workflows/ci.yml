name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make check

  # Windows 没有 make：直接用 go 命令。除了验证代码在 Windows 上能编译，还会
  # 真实执行平台测试（taskkill /T 的进程树收尾、Job Object 的 CPU/内存限额），
  # 这些在 darwin/linux 上跑不了。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

# jiaoag 服务端配置样例。
# 复制到 ~/.config/jiaoag/config.yaml（或运行 jiaoag-server -init）后按需修改。

server:
  # 首版只监听回环地址；协议按可远程设计，但传输加密留到远程部署时再谈。
  listen: 127.0.0.1:8787
  # 单用户 token，支持三种写法：明文 / $ENV_NAME / file:/abs/path
  token: $JIAOAG_TOKEN

storage:
  db_path: ~/.local/share/jiaoag/jiaoag.db
  output_dir: ~/.local/share/jiaoag/outputs

policy:
  # 本地收紧规则目录；外部规则只能让命令落到审批，不能放宽白名单（ADR-0010）。
  dir: ~/.config/jiaoag/policy.d

exec:
  # v1 只有 direct（宿主直连）。降级必须显式，不会静默回退（ADR-0011）。
  backend: direct
  # 单条命令的默认超时秒数；单次调用可在 1-600 之间覆盖。
  timeout_s: 120
  # 进事件的输出上限，必须低于 agent 的 8 KB 截断阈值。
  event_limit: 8192
  # 全文日志的磁盘上限。
  log_limit: 4194304
  # 单条命令的资源上限；0 = 不限制（默认，保持历史行为）。
  # Unix 通过 sh 包装的 ulimit 施加；非 Unix 平台会降级并在审计里记 limits_degraded。
  limits:
    cpu_seconds: 0        # 建议 300：单条命令累计 CPU 时间上限
    memory_mb: 0          # 建议 4096：非 0 时不得小于 64
    max_files: 0          # 建议 1024：同时打开的文件句柄数

agent:
  # 单个任务的最大轮次，兜底防止失控循环。
  max_rounds: 24
  # 单条命令的超时秒数（exec.timeout_s 未配置时沿用）。
  command_timeout_seconds: 120
  # 上下文预算（UTF-8 字符数）。超出时从最旧一轮开始丢弃，system 与
  # 最后一条用户消息永不丢。
  context_budget_chars: 60000
  # 跨会话同时执行的任务数上限；0 = 用默认（4）。
  max_concurrent_tasks: 4
  # 单会话排队任务数上限；0 = 用默认（16）。超出时 task.submit 返回 queue_full。
  max_queue_depth: 16

# type 取 openai（OpenAI 兼容协议）或 anthropic（Messages API）。
providers:
  - name: deepseek
    type: openai
    base_url: https://api.deepseek.com/v1
    model: deepseek-chat
    api_key: $DEEPSEEK_API_KEY
    # 单次尝试的首块超时（秒），默认 120。流式收到首块后改为空闲超时。
    timeout_seconds: 120
    # 只对限流与暂时性失败生效，默认 2；写 0 表示不重试。
    max_retries: 2
    # 每分钟请求数 / token 数上限；0 = 不限。超出配额的请求会等待，不会失败。
    # rpm: 60
    # tpm: 200000

  - name: anthropic
    type: anthropic
    base_url: https://api.anthropic.com
    model: claude-sonnet-4-5
    api_key: file:~/.config/jiaoag/anthropic.key
    timeout_seconds: 180
    max_retries: 1
    # 每分钟请求数 / token 数上限；0 = 不限。超出配额的请求会等待，不会失败。
    # rpm: 60
    # tpm: 200000

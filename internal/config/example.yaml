# jiaoag 服务端配置样例。
# 复制到 ~/.config/jiaoag/config.yaml（或运行 jiaoag-server -init）后按需修改。

server:
  # 默认只监听回环地址。需要远程访问时改 listen 并配置下面的 TLS（wss）。
  listen: 127.0.0.1:8787
  # 单用户 token，支持三种写法：明文 / $ENV_NAME / file:/abs/path
  # 多令牌与只读权限用下面的 tokens；两者可同时存在，token 等价于名为 default 的可写令牌。
  token: $JIAOAG_TOKEN
  # 命名令牌：改完 kill -HUP <server pid> 即热重载，连接不中断；删掉一条再 HUP 就是吊销。
  # read_only 只能订阅事件、拉审计、列会话、看模型与 MCP 状态，
  # 不能提交任务、裁决审批、改会话或信任项目（见 docs/tokens.md）。
  # tokens:
  #   - name: ops
  #     value: file:~/.config/jiaoag/token
  #   - name: viewer
  #     value: $JIAOAG_READONLY_TOKEN
  #     read_only: true
  # 可选：同时配置证书与私钥即启用 TLS（wss）。只配一个会启动报错。
  # 自签证书可用 openssl 生成，连接时 TUI 加 -insecure（见 docs/tls.md）。
  # tls_cert: ~/.config/jiaoag/tls/cert.pem
  # tls_key: ~/.config/jiaoag/tls/key.pem

storage:
  db_path: ~/.local/share/jiaoag/jiaoag.db
  output_dir: ~/.local/share/jiaoag/outputs

policy:
  # 本地收紧规则目录；外部规则只能让命令落到审批，不能放宽白名单（ADR-0010）。
  dir: ~/.config/jiaoag/policy.d

project:
  # 工作区里的项目级扩展（AGENTS.md、.jiaoag/prompts/*.md、.jiaoag/skills、
  # .agents/skills、.jiaoag/mcp.yaml）怎么处理：
  #   ask  默认，首次发现时提示，用户 /trust 确认后才加载；内容变化要重新确认
  #   auto 不确认，直接加载（只在你自己的仓库里用）
  #   off  完全忽略
  # 仓库是别人写的代码，所以默认不信任（ADR-0025）。
  mode: ask

exec:
  # direct：宿主直连（默认）。sandbox：macOS 用 sandbox-exec，Linux 用 bwrap。
  # 降级必须显式，不会静默回退（ADR-0011）：sandbox 探测失败会直接启动报错。
  backend: direct
  # 单条命令的默认超时秒数；单次调用可在 1-600 之间覆盖。
  timeout_s: 120
  # 进事件的输出上限，必须低于 agent 的 8 KB 截断阈值。
  event_limit: 8192
  # 全文日志的磁盘上限。
  log_limit: 4194304
  # 单条命令的资源上限；0 = 不限制（默认，保持历史行为）。
  # Unix 通过 sh 包装的 ulimit 施加；非 Unix 平台会降级并在审计里记 limits_degraded。
  limits:
    cpu_seconds: 0        # 建议 300：单条命令累计 CPU 时间上限
    memory_mb: 0          # 建议 4096：非 0 时不得小于 64
    max_files: 0          # 建议 1024：同时打开的文件句柄数

agent:
  # 单个任务的最大轮次，兜底防止失控循环。
  max_rounds: 24          # 单任务轮数上限；0 表示不限制
  # 单条命令的超时秒数（exec.timeout_s 未配置时沿用）。
  command_timeout_seconds: 120
  # 上下文预算（UTF-8 字符数）。超出时从最旧一轮开始丢弃，system 与
  # 最后一条用户消息永不丢。
  context_budget_chars: 60000
  # 上下文压缩：auto（默认）在占用超过预算 80% 时把较早轮次压成摘要，
  # 保留最近 2 轮；off 关闭，只做丢弃。压缩调用计入任务 token 用量。
  context_compact: auto
  # 跨会话项目记忆：auto（默认）注入工作区 MEMORY.md，并注册 remember 工具
  # （追加记忆走 diff 审批）；off 关闭，既不注入也不提供写入工具。
  memory: auto
  # 技能包：auto（默认）把技能名与适用场景做成索引放进系统提示，正文由
  # skill 工具按需加载；off 关闭。
  skills: auto
  # 技能目录；留空用 ~/.agents/skills（Claude / OpenCode 的 SKILL.md 格式）。
  # 目录里的每个子目录需带 SKILL.md；相对路径按会话工作区根解析。
  # skills_dirs:
  #   - ~/.agents/skills
  #   - .jiaoag/skills
  # 跨会话同时执行的任务数上限；0 = 用默认（4）。
  max_concurrent_tasks: 4
  # 单会话排队任务数上限；0 = 用默认（16）。超出时 task.submit 返回 queue_full。
  max_queue_depth: 16
  # 重启后继续执行排队中的任务（默认 true）。执行中/等审批的任务仍按失败收尾，
  # 不会自动重跑；设为 false 则关闭时把排队任务一并取消（v1 行为）。
  resume_queued: true
  # allow_session 授权的有效期。授权落库、跨重启生效，但过期后同类操作会重新
  # 询问；接受 12h / 30m 这类时长写法，默认 12h（ADR-0030）。
  approval_ttl: 12h

# type 取 openai（OpenAI 兼容协议）或 anthropic（Messages API）。
providers:
  - name: deepseek
    type: openai
    base_url: https://api.deepseek.com/v1
    model: deepseek-chat
    # 单 key 写法；多 key 用 api_keys（优先于 api_key）。多 key 时请求轮询，
    # 鉴权 / 额度 / 限流失败的 key 冷却一段时间后自动跳过。
    api_key: $DEEPSEEK_API_KEY
    # api_keys:
    #   - $DEEPSEEK_API_KEY_1
    #   - $DEEPSEEK_API_KEY_2
    # models 是 /models 的候选列表：配了就只展示这些，不请求供应商的 /models
    # 接口（适合网关不支持列表，或只想暴露少数模型）。留空则运行时向供应商查询。
    # models:
    #   - deepseek-chat
    #   - deepseek-reasoner
    # 单次尝试的首块超时（秒），默认 120。流式收到首块后改为空闲超时。
    timeout_seconds: 120
    # 只对限流与暂时性失败生效，默认 2；写 0 表示不重试。
    max_retries: 2
    # 每分钟请求数 / token 数上限；0 = 不限。超出配额的请求会等待，不会失败。
    # rpm: 60
    # tpm: 200000

  - name: anthropic
    type: anthropic
    base_url: https://api.anthropic.com
    model: claude-sonnet-4-5
    api_key: file:~/.config/jiaoag/anthropic.key
    timeout_seconds: 180
    max_retries: 1
    # 每分钟请求数 / token 数上限；0 = 不限。超出配额的请求会等待，不会失败。
    # rpm: 60
    # tpm: 200000

# MCP：以 stdio 启动的外部工具服务器（ADR-0014）。
# 每台 server 一个子进程，工具暴露为 mcp__<name>__<tool>；外部工具与 server
# 同权限，不是沙箱。写进配置即视为信任：默认免审、只记 external.allow 审计；
# 需要把关的 server 显式写 trust: ask 改成逐次审批。
# 启动失败只跳过该 server，不会让任务构造失败。
mcp:
  servers: []
  # - name: filesystem
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/Users/me/code"]
  #   # 传给子进程的环境变量（在继承当前环境的基础上追加）。
  #   env:
  #     LOG_LEVEL: info
  #   # 子进程工作目录；默认继承 server 的 cwd。
  #   dir: ~/code
  #   # 单次 tools/call 的超时秒数，默认 60，范围 1-600。
  #   timeout_s: 60
  #   # allow（默认，配置即信任，免审并记 external.allow 审计）或 ask（逐次审批）。
  #   trust: allow
  #   # 只让部分工具进注册表；名字是 server 自己的工具名，不含 mcp__ 前缀。
  #   # include 非空时只保留列出的，再减去 exclude；都为空表示全部保留。
  #   # 典型用法：只读接入 LSP server，把 edit_file / rename_symbol 挡在外面。
  #   tools:
  #     include: [definition, references, hover, diagnostics]
  #     exclude: [edit_file, rename_symbol]
  #   enabled: true

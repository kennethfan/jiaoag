# 默认规则集模板（ADR-0004 / ADR-0045）。
#
# 首次启动时由 jiaoag 从内置模板生成为 policy.d/default.yaml，之后完全归你：
# 删除条目就是收回权限，加条目就是放宽，改完重启生效。
# 同目录其他 *.yaml 与签名 feed 仍然只能收紧；本项目对 .git 等路径的保护
# 由 sandbox 与写入敏感清单负责，不在这里表达。
#
# 三条约束缺一不可：
#   programs —— 只放行已知程序；argv[0] 必须是程序名本身（带路径一律审批）；
#   allow_flags/deny_flags —— 未列出的 flag 一律审批（--output、-exec 等）；
#   path_args —— 非 flag 参数必须落在工作区根内。
# risk_subcommands 是提示性列表；publish/deploy 这类底线另在代码里强制
# （删掉这里的条目也不会放行）。
#
# git 不在这里放行：`git status/diff/log` 会读取仓库自己的配置（diff.external、
# gitattributes driver、core.fsmonitor），repo 被改过就等于一条免审批的任意
# 执行通道。只读 git 走 internal/tools 的三个专用工具，它们固定注入了
# `-c core.fsmonitor=false` 与 `--no-ext-diff --no-textconv`；run_command 里的
# git 一律需要审批。
version: builtin-4
rules:
  - id: exec.go
    programs: [go]
    # build 在 v2.41 回到白名单：工作区写入默认免审（ADR-0042）之后，
    # “产物落在当前目录”不再构成绕过审批的理由。会写到任意位置的 flag
    # （-o、-pkgdir）仍被 deny_flags 拦住。
    subcommands: [test, vet, run, build, mod]
    allow_flags:
      [-v, -run, -count, -timeout, -short, -race, -bench, -benchtime,
       -json, -failfast, -tags, -p, -cover, -covermode, -parallel,
       -shuffle, -vet, -trimpath, -mod, -buildvcs, -a, -n, -x]
    deny_flags:
      [-exec, -toolexec, -o, -overlay, -C, -modfile, -coverprofile,
       -cpuprofile, -memprofile, -blockprofile, -mutexprofile, -trace,
       -outputdir, -ldflags, -gcflags, -asmflags, -buildmode, -pkgdir]
    path_args: true

  # 打包/构建类工具：日常开发主循环，默认放行（ADR-0043）。
  # 不放行列出的“高风险子命令”仍然审批——它们会离开本机或操作凭据，
  # 与“在错目录跑了一次构建”不是一个量级。
  - id: exec.npm
    programs: [npm, pnpm]
    risk_subcommands:
      [publish, unpublish, exec, x, dlx, login, adduser, logout,
       token, owner, access, deprecate, dist-tag, deploy]
    deny_flags:
      [-g, --global, --prefix, --registry, --userconfig, --globalconfig,
       --location, --global-dir, --global-bin-dir]
    path_args: true

  - id: exec.mvn
    programs: [mvn, mvnw]
    risk_subcommands: [deploy, release, versions:set]
    deny_flags:
      [-f, --file, -s, --settings, -gs, --global-settings, -t, --toolchains,
       -Dmaven.repo.local]
    path_args: true

  - id: exec.gradle
    programs: [gradle, gradlew]
    risk_subcommands: [publish, uploadArchives, deploy]
    deny_flags:
      [-p, --project-dir, -b, --build-file, -c, --settings-file,
       --init-script, -g, --gradle-user-home, --project-cache-dir]
    path_args: true

  - id: exec.make
    programs: [make]
    risk_subcommands: [install, uninstall]
    deny_flags: [-f, --file, -C, --directory, -I, --include-dir, --eval]
    path_args: true

  - id: exec.ls
    programs: [ls]
    allow_flags: [-l, -a, -A, -h, -1, -R, -r, -t, -S, -F, -d, -p]
    path_args: true

  - id: exec.cat
    programs: [cat]
    allow_flags: [-n, -b, -s, -E, -T, -v]
    path_args: true

  - id: exec.head
    programs: [head]
    allow_flags: [-n, -c, -q, -v]
    path_args: true

  - id: exec.wc
    programs: [wc]
    allow_flags: [-l, -w, -c, -m, -L]
    path_args: true
